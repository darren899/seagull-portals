<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Seagull Maritime</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root { --navy:#003C72; --navy-dark:#002A52; --cyan:#00A3D9; --slate:#42515A; }
  body {
    font-family:'Open Sans',-apple-system,sans-serif;
    background:linear-gradient(135deg,var(--navy-dark) 0%,var(--navy) 100%);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:#fff; padding:24px;
  }
  .card { text-align:center; max-width:440px; }
  .mark { font-family:'Montserrat',sans-serif; font-weight:800; letter-spacing:2px;
    font-size:26px; color:#fff; margin-bottom:6px; }
  .rule { width:54px; height:3px; background:var(--cyan); margin:18px auto 22px; border-radius:2px; }
  p { color:rgba(255,255,255,0.78); font-size:15px; line-height:1.6; margin-bottom:28px; }
  a.btn {
    display:inline-block; text-decoration:none; font-family:'Montserrat',sans-serif;
    font-weight:600; font-size:14px; letter-spacing:0.5px; color:var(--navy-dark);
    background:#fff; padding:13px 30px; border-radius:8px; transition:transform .15s ease, box-shadow .15s ease;
  }
  a.btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.25); }
  .foot { margin-top:34px; font-size:11px; letter-spacing:1px; color:rgba(255,255,255,0.4);
    text-transform:uppercase; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">SEAGULL MARITIME</div>
    <div class="rule"></div>
    <p>This portal is reached by direct link only.<br>If you are a client conducting due diligence, use the access link provided to you.</p>
    <a class="btn" href="dd/index.html">Due Diligence Portal</a>
    <div class="foot">Authorised access only</div>
  </div>
</body>
</html>
